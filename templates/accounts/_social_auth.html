<div class="oauth-divider"><span>or continue with</span></div>
<div class="oauth-actions">
  <button class="button button-secondary button-wide oauth-button" type="button" data-provider="google">
    <svg class="provider-logo google-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8V33c3.4 6.7 10.3 11 18.2 11Z"/><path fill="#FBBC05" d="M12.6 27.7a12 12 0 0 1 0-7.4v-5H5.8a20 20 0 0 0 0 17.4l6.8-5Z"/><path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4 16.1 4 9.2 8.3 5.8 15l6.8 5C14.2 15.6 18.7 12 24 12Z"/></svg>
    {{ action }} with Google
  </button>
  <button class="button button-secondary button-wide oauth-button" type="button" data-provider="github">
    <svg class="provider-logo github-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.3.8-.6v-2.1c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 .1.8 1.9 3.4 1.4.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.5.1-3.1 0 0 .9-.3 3.1 1.1a10.7 10.7 0 0 1 5.7 0c2.2-1.5 3.1-1.1 3.1-1.1.6 1.6.2 2.8.1 3.1.7.8 1.1 1.8 1.1 3 0 4.2-2.6 5.2-5.1 5.5.4.3.8 1 .8 2v3c0 .3.2.7.8.6A11.1 11.1 0 0 0 12 .9Z"/></svg>
    {{ action }} with GitHub
  </button>
</div>
<p class="login-footnote" id="oauth-status" role="status" aria-live="polite"></p>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script>
  if (!firebase.apps.length) firebase.initializeApp({apiKey:"AIzaSyBdOsGzbh_Im3X4KgZluo1o1EgGTKK7BeM",authDomain:"difftara-ai-139ec.firebaseapp.com",projectId:"difftara-ai-139ec",appId:"1:164065747404:web:dde7e02fe66512d6ac7d69"});
  document.querySelectorAll('[data-provider]').forEach(button=>button.addEventListener('click',async()=>{
    const status=document.getElementById('oauth-status');
    try {
      const Provider=button.dataset.provider==='google'?firebase.auth.GoogleAuthProvider:firebase.auth.GithubAuthProvider;
      const provider=new Provider();
      if(button.dataset.provider==='github') provider.addScope('user:email');
      const result=await firebase.auth().signInWithPopup(provider);
      const response=await fetch('{% url "firebase_login" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':'{{ csrf_token }}'},body:JSON.stringify({id_token:await result.user.getIdToken()})});
      if(!response.ok) throw new Error((await response.json()).error||'Sign-in could not be completed.');
      const target=new URL(new URLSearchParams(location.search).get('next')||'{% url "dashboard" %}',location.origin);
      location.href=target.origin===location.origin?target.href:'{% url "dashboard" %}';
    } catch(error) { status.textContent=error.message; }
  }));
</script>
